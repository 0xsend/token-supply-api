# RPC endpoints carry provider API keys, so they come from 1Password item
# `token-supply-api` in the sendapp-prod vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: token-supply-api
  labels:
    app.kubernetes.io/name: token-supply-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-sendapp-prod
  target:
    name: token-supply-api
    creationPolicy: Owner
  data:
    - secretKey: MAINNET_RPC_URL
      remoteRef:
        key: token-supply-api
        property: mainnet-rpc-url
    - secretKey: BASE_RPC_URL
      remoteRef:
        key: token-supply-api
        property: base-rpc-url
