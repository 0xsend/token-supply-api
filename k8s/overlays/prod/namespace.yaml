apiVersion: v1
kind: Namespace
metadata:
  name: token-supply-prod
  labels:
    # Injects the ghcr-credentials image pull secret (fleet convention).
    ghcr-enabled: "true"
    app.kubernetes.io/name: token-supply-api
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
